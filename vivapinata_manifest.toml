# ReXGlue v0.10 manifest for Viva Pinata (2006, Rare)
#
# Title ID   : 4D5307F2  (US/EU multi-region disc, game_regions = 0x00FF00FF)
# Media ID   : 690B3287
# PE name    : PinataParadiseRO.pe  (linked 2006-10-21, XDK 2.0.3529)
# Image      : base 0x82000000, size 0x00B90000 (0x82000000..0x82B90000)
# Entry      : 0x826B8B48
# TLS        : 64 slots, raw @ 0x82B09000
# Imports    : xboxkrnl.exe (276), xam.xex (170)  - no game DLLs, no [[modules]]
# XEX format : encrypted (normal) + LZX compressed - handled by the SDK loader
#
# Skeleton generated by `rexglue init` (v0.10.0.8-dev.g1406e1b), then split
# into layered includes (config/*.toml) the way the TiP-Recomp reference does.
# Merge semantics (rex/codegen/config.h): scalars last-wins, keyed tables
# additive, arrays-of-tables deduplicated by primary key.
#
# Any change to this file, an included TOML or the XEX makes the Visual
# Studio build re-run codegen and wipe generated/default/. Never edit
# generated/ by hand.

[project]
name = "vivapinata"
sdk_version = "0.10.0"
game_root = "game_files"

[entrypoint]
file_path = "game_files/default.xex"
out_directory_path = "generated/default"

# setjmp/longjmp live in the statically linked CRT (LIBCPMT/XAPILIB 2.0.3529).
# Addresses are unknown until the first codegen; leave unset (AO2 does the
# same), then locate them via the generated code and set both together.
# TiP-Recomp values (0x82AE2EA0 / 0x82AE2A60) belong to a DIFFERENT XEX.
#setjmp_address  = 0x00000000
#longjmp_address = 0x00000000

includes = [
    "config/vivapinata_ctx.toml",        # register localization flags + [analysis]
    "config/vivapinata_functions.toml",  # manual [functions] boundaries (UnresolvedCall fixes)
    "config/vivapinata_hooks.toml",      # [functions] with `name` -> symbol names for hooks
    "config/vivapinata_midasm.toml",     # [[midasm_hook]] instruction-level hooks
    "config/vivapinata_crt.toml",        # [rexcrt] native CRT offloading
]
