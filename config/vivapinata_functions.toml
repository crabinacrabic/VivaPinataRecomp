# vivapinata_functions.toml - manual function boundaries
#
# Included from vivapinata_manifest.toml. Hand-maintained, NOT tool-generated.
#
# Codegen discovers functions from the call graph (bl targets, vtables, pdata).
# Code reached only through a plain `b`, a computed jump or a function pointer
# the scanner could not follow shows up as an `UnresolvedCall` validation
# error, or at runtime as
#   "Call to invalid or unregistered function 0x82XXXXXX".
# Add the address here with an empty table and let analysis find the size:
#
#   0x82XXXXXX = {}                         # size 0 -> boundary via region scan
#   0x82XXXXXX = { size = 0x1C0 }           # explicit size when the scanner overruns
#   0x82XXXXXX = { end  = 0x82XXXYYY }      # explicit end (exclusive), alternative to size
#   0x82XXXXXX = { parent = 0x82XXXAAA }    # discontinuous chunk of another function
#   0x82XXXXXX = { share_registers = true } # MSVC SEH funclet reading caller registers
#
# Runtime discovery loop (see KB COMMUNITY_KNOWLEDGE.md): breakpoint on the
# fatal "unregistered function" log -> read ctx.ctr.u32 -> add here -> F7.

[functions]

# --- codegen #1 (2026-09-20, SDK 0.10.0.8): Validate phase, 2 UnresolvedCall ---
# Tail-jump targets (`b`, not `bl`) that no call-graph edge reached.
0x82481D70 = {}   # b 0x82481D70 from 0x82482E94 - target not in any function
0x822F12C0 = {}   # b 0x822F12C0 from 0x822F0EA8 - target not in any function

