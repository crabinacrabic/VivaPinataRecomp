# vivapinata_midasm.toml - instruction-level (mid-asm) hooks
#
# Included from vivapinata_manifest.toml. Schema per rex/codegen/config.h
# (MidAsmHook) and verified against SDK 0.10 config.cpp:
#
#   [[midasm_hook]]
#   address           = 0x82XXXXXX      # instruction address inside a recompiled function
#   name              = "my_hook"       # host symbol: extern "C"-less C++ function
#   registers         = ["r3", "f1"]    # rN, fN, crN, ctr, xer, fpscr, vN -> passed by reference
#   after_instruction = true            # false = before the instruction executes
#   # exactly one of the following outcome groups:
#   return                = true        # `void name(...)`; return from the function
#   return_on_true        = true        # `bool name(...)`; return when hook yields true
#   return_on_false       = true
#   jump_address          = 0x82XXXXXX  # `void name(...)`; unconditional goto
#   jump_address_on_true  = 0x82XXXXXX  # `bool name(...)`; conditional goto
#   jump_address_on_false = 0x82XXXXXX
#
# Host side (src/game_fixes.h):
#   bool my_hook() { return true; }                 # for *_on_true / *_on_false
#   void my_hook(PPCRegister& r3) { r3.u32 = 1; }   # registers arrive as PPCRegister&
#
# Array-of-tables entries are deduplicated by `address` across includes.
#
# TiP-Recomp uses this mechanism for: CPU/GPU fps hooks, vsync interval
# (`vsync_hook` on r10), skipSecondDraw/skipFirstDraw, skiplighting,
# AspectRatio_hook (r3), SkipIntroVideos. All of those addresses are sequel
# addresses and must be re-derived for this XEX.

# --- vpkd3d128 v0,v0,5,2,2 (FLOAT16_4, in place): SDK codegen loses the sign
# of guest lane x when vD == vB. Hook runs BEFORE the instruction, packs
# correctly and jumps over the generated code. See src/game_fixes.h section 1.
# Non-in-place packs (0x82137C50/54, 0x82137CB8/C8, 0x82461A3C, FLOAT16_2
# 0x82461A10) are correct and intentionally not hooked.

# sub_8220A1C8
